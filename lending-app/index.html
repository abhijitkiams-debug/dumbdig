<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F766E" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Setu Finance" />
  <title>Setu Finance — Loans made simple</title>
  <link rel="stylesheet" href="assets/styles.css?v=14" />
  <link rel="stylesheet" href="copilot-sdk/copilot.css?v=14" />
</head>
<body>
  <!-- ===== HOST APP: the client's own UI (copilot never modifies this) ===== -->
  <header class="app-bar">
    <button class="app-back" id="app-back" hidden>‹</button>
    <div class="logo">🪷</div>
    <div>
      <h1>Setu Finance</h1>
      <div class="tag">Loans made simple</div>
    </div>
    <div class="spacer"></div>
    <div class="rbi">RBI-registered NBFC · Demo</div>
  </header>

  <!-- Screens (browse + apply) are rendered here by host-app.js -->
  <main id="app"></main>

  <div id="toast" class="toast"></div>

  <!-- Optional local voice config (git-ignored, never committed). No-op if absent. -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'copilot-sdk/voice-config.local.js';
      s.async = false; s.onerror = function () {};
      document.head.appendChild(s);
    })();
  </script>

  <!-- ===== dependencies first, then host app boots + mounts the copilot ===== -->
  <script src="src/data/products.js?v=14"></script>
  <script src="copilot-sdk/nlu.js?v=14"></script>
  <script src="copilot-sdk/voice.js?v=14"></script>
  <script src="copilot-sdk/copilot.js?v=14"></script>
  <script src="src/host-app.js?v=14"></script>
</body>
</html>
