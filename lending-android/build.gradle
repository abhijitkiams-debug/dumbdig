plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// --- Sarvam API key injection -------------------------------------------------
// The key is NEVER committed. It is read (in this order) from:
//   1) local.properties  -> SARVAM_API_KEY=sk_...   (git-ignored)
//   2) the SARVAM_API_KEY environment variable
// and is also overridable at runtime from the in-app settings dialog.
import java.util.Properties
def sarvamKey = ""
def lp = rootProject.file("local.properties")
if (lp.exists()) {
    def props = new Properties()
    lp.withInputStream { props.load(it) }
    sarvamKey = props.getProperty("SARVAM_API_KEY", "")
}
if (!sarvamKey?.trim()) {
    sarvamKey = System.getenv("SARVAM_API_KEY") ?: ""
}

android {
    namespace 'com.setu.lending'
    compileSdk 34

    defaultConfig {
        applicationId "com.setu.lending"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "SARVAM_API_KEY", "\"${sarvamKey}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.core:core-ktx:1.13.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
